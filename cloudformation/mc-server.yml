AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Vanilla Minecraft Java Edition server on EC2 — one stack per Minecraft version.
  World data lives on a dedicated EBS volume (DeletionPolicy=Retain) so changing the
  instance type terminates the old instance but preserves the volume. Access the
  instance via AWS Systems Manager Session Manager (CloudShell or the EC2 console) —
  no SSH key required.

Parameters:
  MinecraftVersion:
    Type: String
    Default: '1.20.4'
    Description: >
      Minecraft server version (e.g. 1.20.4, 1.19.4, 1.16.5, 1.8.9).
      Java is selected automatically: <1.17 → Java 8, 1.17-1.20.4 → Java 17, ≥1.20.5 → Java 21.

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3.xlarge]
    Description: t3.medium (2 vCPU / 4 GB) handles ~10 players. Changing this replaces the instance; the data volume is preserved.

  ServerMemoryMB:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 14336
    Description: JVM heap size in MB. Leave ~1 GB for the OS.

  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 500
    Description: EBS data volume size in GB. Increasing this grows the volume in place; decreasing is not supported.

  AllowedCIDR:
    Type: String
    Default: '0.0.0.0/0'
    Description: CIDR block allowed to reach the Minecraft game port (25565). Restrict for private servers.

  SnapshotId:
    Type: String
    Default: ''
    Description: >
      Optional EBS snapshot ID. If provided, the data volume is initialized from this snapshot
      (used by deploy.sh during cross-region migration to carry the world from the old region).

Conditions:
  HasSnapshot: !Not [!Equals [!Ref SnapshotId, '']]

Resources:
  MinecraftSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Minecraft server - game port only (admin access via SSM)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 25565
          ToPort: 25565
          CidrIp: !Ref AllowedCIDR
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # IAM role allowing the instance to be managed via Systems Manager Session Manager
  # and to upload world backups to the shared mc-worlds-<account>-<region> bucket.
  SsmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WorldsBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}/*'
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}'

  SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SsmRole

  # Dedicated data volume — survives instance replacement and stack deletion.
  # When SnapshotId is set (migration), the volume is restored from that snapshot.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref VolumeSize
      VolumeType: gp3
      SnapshotId: !If [HasSnapshot, !Ref SnapshotId, !Ref AWS::NoValue]
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-data'
        - Key: MinecraftVersion
          Value: !Ref MinecraftVersion

  MinecraftServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      AvailabilityZone: !Select [0, !GetAZs '']
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      IamInstanceProfile: !Ref SsmInstanceProfile
      SecurityGroups:
        - !Ref MinecraftSG
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
        - Key: MinecraftVersion
          Value: !Ref MinecraftVersion
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/mc-setup.log 2>&1

          MC_VERSION="${MinecraftVersion}"

          # Determine required Java version from minor.patch
          MINOR=$(echo "$MC_VERSION" | cut -d. -f2)
          PATCH_RAW=$(echo "$MC_VERSION" | cut -d. -f3)
          if [ -z "$PATCH_RAW" ]; then PATCH=0; else PATCH=$PATCH_RAW; fi

          if [ "$MINOR" -ge 20 ] && [ "$PATCH" -ge 5 ]; then
            JAVA_PKG="java-21-amazon-corretto-headless"
          elif [ "$MINOR" -ge 17 ]; then
            JAVA_PKG="java-17-amazon-corretto-headless"
          else
            JAVA_PKG="java-1.8.0-amazon-corretto-headless"
          fi

          rpm --import https://yum.corretto.aws/corretto.key
          curl -fsSL https://yum.corretto.aws/corretto.repo -o /etc/yum.repos.d/corretto.repo
          yum install -y $JAVA_PKG python3 curl

          # Wait for the data volume attachment to appear (Nitro: nvme1n1; legacy: xvdf/sdf)
          DEVICE=""
          for i in $(seq 1 60); do
            for dev in /dev/nvme1n1 /dev/xvdf /dev/sdf; do
              if [ -b "$dev" ]; then DEVICE="$dev"; break 2; fi
            done
            sleep 2
          done
          if [ -z "$DEVICE" ]; then
            echo "Data volume never appeared" >&2
            exit 1
          fi

          # Format only if the volume has no filesystem (first deploy)
          if ! blkid "$DEVICE" >/dev/null 2>&1; then
            mkfs.ext4 -L minecraft "$DEVICE"
          fi

          mkdir -p /opt/minecraft
          if ! mountpoint -q /opt/minecraft; then
            mount "$DEVICE" /opt/minecraft
          fi

          UUID=$(blkid -s UUID -o value "$DEVICE")
          grep -q "^UUID=$UUID" /etc/fstab || \
            echo "UUID=$UUID /opt/minecraft ext4 defaults,nofail 0 2" >> /etc/fstab

          id minecraft &>/dev/null || \
            useradd -r -d /opt/minecraft -s /sbin/nologin minecraft

          # Only download the server jar on first deploy (volume was empty)
          if [ ! -f /opt/minecraft/server.jar ]; then
            curl -fsSL https://launchermeta.mojang.com/mc/game/version_manifest.json \
              -o /tmp/manifest.json

            VERSION_URL=$(python3 - "$MC_VERSION" << 'PYEOF'
          import json, sys
          mc_ver = sys.argv[1]
          with open('/tmp/manifest.json') as f:
              data = json.load(f)
          matches = [v['url'] for v in data['versions'] if v['id'] == mc_ver]
          if not matches:
              sys.exit('Version ' + mc_ver + ' not found in Mojang manifest')
          print(matches[0])
          PYEOF
          )
            curl -fsSL "$VERSION_URL" -o /tmp/version.json
            SERVER_URL=$(python3 - << 'PYEOF'
          import json
          with open('/tmp/version.json') as f:
              data = json.load(f)
          print(data['downloads']['server']['url'])
          PYEOF
          )
            curl -fsSL "$SERVER_URL" -o /opt/minecraft/server.jar
          fi

          [ -f /opt/minecraft/eula.txt ] || echo "eula=true" > /opt/minecraft/eula.txt

          if [ ! -f /opt/minecraft/server.properties ]; then
            cat > /opt/minecraft/server.properties << 'PROPEOF'
          server-port=25565
          online-mode=true
          max-players=20
          motd=Minecraft Server
          view-distance=10
          PROPEOF
          fi

          # First-boot world restore: if the data volume has no world yet but the
          # shared S3 bucket has one for this version, pull it down. On instance
          # replacement (volume preserved) this is a no-op since level.dat exists.
          if [ ! -f /opt/minecraft/world/level.dat ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
            if [ -n "$ACCOUNT_ID" ]; then
              BUCKET=mc-worlds-$ACCOUNT_ID
              BUCKET_REGION=$(aws s3api get-bucket-location --bucket "$BUCKET" \
                --query 'LocationConstraint' --output text 2>/dev/null || echo "")
              if [ -z "$BUCKET_REGION" ] || [ "$BUCKET_REGION" = "None" ] || [ "$BUCKET_REGION" = "null" ]; then
                BUCKET_REGION=us-east-1
              fi
              if aws --region "$BUCKET_REGION" s3 ls "s3://$BUCKET/$MC_VERSION/world.tar.gz" >/dev/null 2>&1; then
                echo "Restoring world from s3://$BUCKET/$MC_VERSION/world.tar.gz..."
                aws --region "$BUCKET_REGION" s3 cp "s3://$BUCKET/$MC_VERSION/world.tar.gz" /tmp/world.tar.gz
                tar xzf /tmp/world.tar.gz -C /opt/minecraft/
                rm -f /tmp/world.tar.gz
              fi
            fi
          fi

          chown -R minecraft:minecraft /opt/minecraft

          cat > /etc/systemd/system/minecraft.service << 'SVCEOF'
          [Unit]
          Description=Minecraft Server
          After=network.target opt-minecraft.mount
          Requires=opt-minecraft.mount

          [Service]
          User=minecraft
          WorkingDirectory=/opt/minecraft
          ExecStart=/usr/bin/java -Xmx${ServerMemoryMB}M -Xms${ServerMemoryMB}M -jar server.jar nogui
          ExecStop=/bin/kill -SIGTERM $MAINPID
          Restart=on-failure
          RestartSec=30
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          systemctl daemon-reload
          systemctl enable minecraft
          systemctl start minecraft

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref MinecraftServer
      VolumeId: !Ref DataVolume

Outputs:
  PublicIP:
    Description: Connect Minecraft clients to this IP on port 25565
    Value: !GetAtt MinecraftServer.PublicIp
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref MinecraftServer
  DataVolumeId:
    Description: Persistent EBS volume holding the world (preserved on stack delete)
    Value: !Ref DataVolume
  SessionManagerConsole:
    Description: Open Session Manager in the AWS Console (no SSH key needed)
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${MinecraftServer}?region=${AWS::Region}'
  SessionManagerCLI:
    Description: Open a shell from CloudShell or local AWS CLI
    Value: !Sub 'aws ssm start-session --target ${MinecraftServer} --region ${AWS::Region}'
