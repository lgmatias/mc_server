AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Vanilla Minecraft Java Edition server on EC2 — one stack per Minecraft version.
  World data lives on a dedicated EBS volume (DeletionPolicy=Retain) so changing the
  instance type terminates the old instance but preserves the volume. Access the
  instance via AWS Systems Manager Session Manager (CloudShell or the EC2 console) —
  no SSH key required.

Parameters:
  MinecraftVersion:
    Type: String
    Default: '1.20.4'
    Description: >
      Minecraft server version (e.g. 1.20.4, 1.19.4, 1.16.5, 1.8.9).
      Java is selected automatically: <1.17 → Java 8, 1.17-1.20.4 → Java 17, ≥1.20.5 → Java 21.

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, t3.xlarge]
    Description: t3.medium (2 vCPU / 4 GB) handles ~10 players. Changing this replaces the instance; the data volume is preserved.

  ServerMemoryMB:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 14336
    Description: JVM heap size in MB. Leave ~1 GB for the OS.

  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 500
    Description: EBS data volume size in GB. Increasing this grows the volume in place; decreasing is not supported.

  AllowedCIDR:
    Type: String
    Default: '0.0.0.0/0'
    Description: CIDR block allowed to reach the Minecraft game port (25565). Restrict for private servers.

Resources:
  MinecraftSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Minecraft server - game port only (admin access via SSM)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 25565
          ToPort: 25565
          CidrIp: !Ref AllowedCIDR
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # IAM role allowing the instance to be managed via Systems Manager Session Manager
  # and to upload world backups to the shared mc-worlds-<account>-<region> bucket.
  SsmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: WorldsBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}/*'
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::mc-worlds-${AWS::AccountId}'

  SsmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SsmRole

  # Dedicated data volume — survives instance replacement and stack deletion.
  # When SnapshotId is set (migration), the volume is restored from that snapshot.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Size: !Ref VolumeSize
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-data'
        - Key: MinecraftVersion
          Value: !Ref MinecraftVersion

  MinecraftServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      AvailabilityZone: !Select [0, !GetAZs '']
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      IamInstanceProfile: !Ref SsmInstanceProfile
      SecurityGroups:
        - !Ref MinecraftSG
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
        - Key: MinecraftVersion
          Value: !Ref MinecraftVersion
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/mc-setup.log 2>&1

          MC_VERSION="${MinecraftVersion}"

          # Determine required Java version from minor.patch
          MINOR=$(echo "$MC_VERSION" | cut -d. -f2)
          PATCH_RAW=$(echo "$MC_VERSION" | cut -d. -f3)
          if [ -z "$PATCH_RAW" ]; then PATCH=0; else PATCH=$PATCH_RAW; fi

          # Mojang's Java requirements:
          #   ≤ 1.16.5         → Java 8
          #   1.17 - 1.20.4    → Java 17 (Mojang said 16 for 1.17 but 17 works there too)
          #   ≥ 1.20.5         → Java 21
          # Earlier this script used `MINOR -ge 20 && PATCH -ge 5` for the Java 21
          # branch, which silently mispicked Java 17 for any MINOR > 20 (e.g. 1.21.0
          # has PATCH=0, so the AND failed). Correct form: MINOR > 20 OR (MINOR == 20 AND PATCH >= 5).
          if [ "$MINOR" -gt 20 ] || { [ "$MINOR" -eq 20 ] && [ "$PATCH" -ge 5 ]; }; then
            CORRETTO_RPM=amazon-corretto-21-x64-linux-jdk.rpm
          elif [ "$MINOR" -ge 17 ]; then
            CORRETTO_RPM=amazon-corretto-17-x64-linux-jdk.rpm
          else
            CORRETTO_RPM=amazon-corretto-8-x64-linux-jdk.rpm
          fi

          # Install Corretto directly from corretto.aws. The Corretto yum repo
          # cannot be used here: AL2's yum-plugin-priorities silently excludes
          # its packages ("No package ... available" even with the repo file
          # in place), and yum still exits 0 when other packages on the same
          # line are already installed — so `set -e` would NOT catch the missing
          # JVM. Same workaround as pgm-server.yml.
          # Guarded with `command -v java` so re-runs (cloud-init clean, or
          # idempotent UserData replay) don't fail: `yum install -y <rpm>` for
          # an already-installed package exits non-zero with "Nothing to do".
          if ! command -v java >/dev/null 2>&1; then
            curl -fsSL -o /tmp/corretto.rpm "https://corretto.aws/downloads/latest/$CORRETTO_RPM"
            yum install -y /tmp/corretto.rpm
            rm -f /tmp/corretto.rpm
          fi

          yum install -y python3 curl

          # Defense in depth: if Java still isn't on PATH, fail UserData loudly
          # rather than letting systemd crash-loop the service silently.
          command -v java >/dev/null || { echo "Java install failed — aborting"; exit 1; }

          # Wait for the data volume attachment to appear (Nitro: nvme1n1; legacy: xvdf/sdf)
          DEVICE=""
          for i in $(seq 1 60); do
            for dev in /dev/nvme1n1 /dev/xvdf /dev/sdf; do
              if [ -b "$dev" ]; then DEVICE="$dev"; break 2; fi
            done
            sleep 2
          done
          if [ -z "$DEVICE" ]; then
            echo "Data volume never appeared" >&2
            exit 1
          fi

          # Format only if the volume has no filesystem (first deploy)
          if ! blkid "$DEVICE" >/dev/null 2>&1; then
            mkfs.ext4 -L minecraft "$DEVICE"
          fi

          mkdir -p /opt/minecraft
          if ! mountpoint -q /opt/minecraft; then
            mount "$DEVICE" /opt/minecraft
          fi

          UUID=$(blkid -s UUID -o value "$DEVICE")
          grep -q "^UUID=$UUID" /etc/fstab || \
            echo "UUID=$UUID /opt/minecraft ext4 defaults,nofail 0 2" >> /etc/fstab

          id minecraft &>/dev/null || \
            useradd -r -d /opt/minecraft -s /sbin/nologin minecraft

          # Only download the server jar on first deploy (volume was empty)
          if [ ! -f /opt/minecraft/server.jar ]; then
            curl -fsSL https://launchermeta.mojang.com/mc/game/version_manifest.json \
              -o /tmp/manifest.json

            VERSION_URL=$(python3 - "$MC_VERSION" << 'PYEOF'
          import json, sys
          mc_ver = sys.argv[1]
          with open('/tmp/manifest.json') as f:
              data = json.load(f)
          matches = [v['url'] for v in data['versions'] if v['id'] == mc_ver]
          if not matches:
              sys.exit('Version ' + mc_ver + ' not found in Mojang manifest')
          print(matches[0])
          PYEOF
          )
            curl -fsSL "$VERSION_URL" -o /tmp/version.json
            SERVER_URL=$(python3 - << 'PYEOF'
          import json
          with open('/tmp/version.json') as f:
              data = json.load(f)
          print(data['downloads']['server']['url'])
          PYEOF
          )
            curl -fsSL "$SERVER_URL" -o /opt/minecraft/server.jar
          fi

          [ -f /opt/minecraft/eula.txt ] || echo "eula=true" > /opt/minecraft/eula.txt

          if [ ! -f /opt/minecraft/server.properties ]; then
            cat > /opt/minecraft/server.properties << 'PROPEOF'
          server-port=25565
          online-mode=true
          max-players=20
          motd=Minecraft Server
          view-distance=10
          PROPEOF
          fi

          chown -R minecraft:minecraft /opt/minecraft

          # World sync from S3 runs on every boot via a oneshot systemd unit
          # (mc-pull-world.service) that orders Before=minecraft.service. S3 is
          # the single source of truth for world state:
          #   - If s3://<bucket>/<version>/world/ has any objects (size > 0),
          #     wipe local /opt/minecraft/world and sync from S3.
          #   - Otherwise wipe local world so minecraft regenerates fresh.
          # server-stop.sh remains the canonical "push to S3" path.
          #
          # Vanilla Java Edition layout: nether (DIM-1) and end (DIM1) are
          # SUBDIRECTORIES of world/, not separate top-level dirs (that's the
          # Bukkit/Spigot convention). `aws s3 sync world/ ...` carries DIM-1
          # and DIM1 along automatically — no need for parallel world_nether/
          # and world_the_end/ prefixes.
          #
          # Listing-check pitfall: `aws s3 ls ... | grep -q .` would close
          # the pipe early, SIGPIPE the aws CLI, and with pipefail the if-test
          # falsely falls to the else branch on a populated prefix. Use
          # list-objects-v2 with --query instead.
          cat > /opt/minecraft/pull-world.sh << PULLEOF
          #!/bin/bash
          set -euo pipefail
          MC_VERSION="$MC_VERSION"
          ACCOUNT_ID=\$(aws sts get-caller-identity --query Account --output text 2>/dev/null || echo "")
          if [ -z "\$ACCOUNT_ID" ]; then
            echo "pull-world: no AWS identity, skipping S3 sync" >&2
            exit 0
          fi
          BUCKET="mc-worlds-\$ACCOUNT_ID"
          BUCKET_REGION=\$(aws s3api get-bucket-location --bucket "\$BUCKET" \\
            --query 'LocationConstraint' --output text 2>/dev/null || echo "")
          if [ -z "\$BUCKET_REGION" ] || [ "\$BUCKET_REGION" = "None" ] || [ "\$BUCKET_REGION" = "null" ]; then
            BUCKET_REGION=us-east-1
          fi
          # Filter Size>0 so the zero-byte folder marker from deploy.sh doesn't
          # count as "S3 has content".
          HAS_CONTENT=\$(aws --region "\$BUCKET_REGION" s3api list-objects-v2 \\
            --bucket "\$BUCKET" --prefix "\$MC_VERSION/world/" \\
            --query 'Contents[?Size > \`0\`].Key | [0]' --output text 2>/dev/null || echo "")
          if [ -n "\$HAS_CONTENT" ] && [ "\$HAS_CONTENT" != "None" ]; then
            echo "pull-world: wiping /opt/minecraft/world and syncing from s3://\$BUCKET/\$MC_VERSION/world/"
            rm -rf /opt/minecraft/world
            aws --region "\$BUCKET_REGION" s3 sync "s3://\$BUCKET/\$MC_VERSION/world/" /opt/minecraft/world/
          else
            echo "pull-world: s3://\$BUCKET/\$MC_VERSION/world/ empty — wiping local world so minecraft regenerates"
            rm -rf /opt/minecraft/world
          fi
          chown -R minecraft:minecraft /opt/minecraft/world 2>/dev/null || true
          PULLEOF
          chmod +x /opt/minecraft/pull-world.sh

          cat > /etc/systemd/system/mc-pull-world.service << 'PULLSVCEOF'
          [Unit]
          Description=Sync Minecraft world from S3 (runs once at boot before minecraft.service)
          After=network-online.target opt-minecraft.mount
          Wants=network-online.target
          Requires=opt-minecraft.mount
          Before=minecraft.service

          [Service]
          Type=oneshot
          ExecStart=/opt/minecraft/pull-world.sh
          RemainAfterExit=yes
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
          PULLSVCEOF

          # Ensure canonical OPs (ocal, L__G) are present in ops.json on every
          # minecraft start. Merges with any in-game `/op <user>` additions so
          # admin-added OPs survive restarts. Hook is ExecStartPre on
          # minecraft.service.
          cat > /opt/minecraft/apply-ops.py << 'OPSEOF'
          #!/usr/bin/env python3
          import json
          import os

          OPS_FILE = '/opt/minecraft/ops.json'
          CANONICAL = [
              {"uuid": "70c5c702-4e70-457b-8d7b-0e22010dc590", "name": "ocal", "level": 4, "bypassesPlayerLimit": False},
              {"uuid": "f4d3811b-a374-4740-86af-ec4938b91048", "name": "L__G", "level": 4, "bypassesPlayerLimit": False},
          ]

          existing = []
          if os.path.exists(OPS_FILE):
              try:
                  with open(OPS_FILE) as f:
                      existing = json.load(f)
              except Exception:
                  existing = []

          canonical_uuids = {o['uuid'] for o in CANONICAL}
          merged = list(CANONICAL) + [o for o in existing if o.get('uuid') not in canonical_uuids]

          with open(OPS_FILE, 'w') as f:
              json.dump(merged, f, indent=2)
          OPSEOF
          chmod 755 /opt/minecraft/apply-ops.py
          chown minecraft:minecraft /opt/minecraft/apply-ops.py

          cat > /etc/systemd/system/minecraft.service << 'SVCEOF'
          [Unit]
          Description=Minecraft Server
          After=network.target opt-minecraft.mount mc-pull-world.service
          Requires=opt-minecraft.mount mc-pull-world.service

          [Service]
          User=minecraft
          WorkingDirectory=/opt/minecraft
          ExecStartPre=/usr/bin/python3 /opt/minecraft/apply-ops.py
          ExecStart=/usr/bin/java -Xmx${ServerMemoryMB}M -Xms${ServerMemoryMB}M -jar server.jar nogui
          ExecStop=/bin/kill -SIGTERM $MAINPID
          Restart=on-failure
          RestartSec=30
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          systemctl daemon-reload
          systemctl enable mc-pull-world minecraft
          systemctl start minecraft

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref MinecraftServer
      VolumeId: !Ref DataVolume

Outputs:
  PublicIP:
    Description: Connect Minecraft clients to this IP on port 25565
    Value: !GetAtt MinecraftServer.PublicIp
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref MinecraftServer
  DataVolumeId:
    Description: Persistent EBS volume holding the world (preserved on stack delete)
    Value: !Ref DataVolume
  SessionManagerConsole:
    Description: Open Session Manager in the AWS Console (no SSH key needed)
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${MinecraftServer}?region=${AWS::Region}'
  SessionManagerCLI:
    Description: Open a shell from CloudShell or local AWS CLI
    Value: !Sub 'aws ssm start-session --target ${MinecraftServer} --region ${AWS::Region}'
