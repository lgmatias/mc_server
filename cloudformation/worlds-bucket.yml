AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Single shared S3 bucket for Minecraft world backups. All server stacks across
  all regions write to this one bucket under a per-version prefix (e.g.
  1.20.4/worlds-YYYYMMDDTHHMMSSZ.tar.gz). The bucket name is mc-worlds-<account>
  (no region suffix) so server IAM policies in any region can reference the same
  ARN. Deploy this stack once, in whichever region you want the bucket to live.

Resources:
  WorldsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'mc-worlds-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: minecraft-world-backups

Outputs:
  BucketName:
    Description: S3 bucket holding world backups
    Value: !Ref WorldsBucket
  BucketArn:
    Description: Bucket ARN
    Value: !GetAtt WorldsBucket.Arn
  ListCommand:
    Description: List all stored backups
    Value: !Sub 'aws s3 ls s3://${WorldsBucket}/ --recursive'
